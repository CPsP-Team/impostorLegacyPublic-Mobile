name: iOS Build
on: workflow_dispatch

jobs:
  Build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      - name: Set HAXEPATH
        run: echo "HAXEPATH=$HAXE_STD_PATH/.." >> $GITHUB_ENV

      - name: Install Libraries
        run: |
          haxelib install hxpkg --quiet
          haxelib run hxpkg install --force

      - name: Build Lime Native Binaries
        run: |
          cd .haxelib/lime/git
          git submodule sync --recursive
          git submodule update --init --recursive --force
          python3 - <<'PY'
          from pathlib import Path

          path = Path("project/lib/sdl_image-files.xml")
          text = path.read_text()
          flag = '<compilerflag value="-DSDL_IMAGE_USE_COMMON_BACKEND" />'
          marker = '<compilerflag value="-DUSE_STBIMAGE" />'

          if flag not in text:
              if marker not in text:
                  raise SystemExit("Could not find SDL_image compiler flag insertion point")
              text = text.replace(
                  marker,
                  marker + '\n\t\t\t<compilerflag value="-DSDL_IMAGE_USE_COMMON_BACKEND" />'
              )
              path.write_text(text)
          PY
          cd ../../../
          haxelib run lime rebuild mac -arm64 -nocolor -eval -D HXCPP_ARM64
          haxelib run lime rebuild ios -arm64 -nocolor -D HXCPP_ARM64
          cd "$(haxelib libpath lime)ndll/iPhone"
          if [ -f liblime.iphoneos-arm64.a ] && [ ! -e liblime.iphoneos.a ]; then
            ln -s liblime.iphoneos-arm64.a liblime.iphoneos.a
          fi

      - name: Compile iOS
        run: haxelib run lime build ios -release -nosign

      - name: Create Ipa
        run: |
          cd export/release/ios/build/Release-iphoneos
          mkdir -p Payload
          mv *.app Payload
          zip -r sus.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: iOS-Release
          path: export/release/ios/build/Release-iphoneos/*.ipa
          if-no-files-found: error
